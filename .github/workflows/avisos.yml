# Publica el servidor d'avisos a Cloudflare cada cop que canvia la carpeta worker/
name: Servidor d'avisos
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/avisos.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
